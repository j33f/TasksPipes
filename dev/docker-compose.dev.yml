# Local test stack with a fake Outline (alice-token / bob-token / carol-token):
#   docker compose --env-file dev/.env.dev -f docker-compose.yml -f dev/docker-compose.dev.yml up --build
services:
  app:
    env_file: !reset []
    environment:
      APP_URL: http://localhost:3000
      APP_SECRET: dev-secret-dev-secret-dev-secret-dev-secret
      OUTLINE_URL: http://localhost:4000
      OUTLINE_API_URL: http://mock-outline:4000
      ALLOW_API_KEY_LOGIN: "true"
    depends_on:
      mock-outline:
        condition: service_started

  db:
    environment:
      POSTGRES_PASSWORD: dev

  mock-outline:
    image: node:26-alpine
    command: ["node", "/mock/mock-outline.mjs"]
    volumes:
      - ./dev/mock-outline.mjs:/mock/mock-outline.mjs:ro
    ports:
      - "4000:4000"
