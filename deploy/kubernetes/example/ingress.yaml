# With ingress-nginx; other controllers need their own annotations for long-lived WebSocket connections.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskspipes
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "30m"
spec:
  ingressClassName: nginx
  rules:
    - host: tasks.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: taskspipes, port: { name: http } }
  # tls: [{ hosts: [tasks.example.com], secretName: taskspipes-tls }]
