# A complete example to try TasksPipes on a cluster (kind, minikube…): the app, a PostgreSQL and a Redis of its own,
# and an Ingress. For production, use the base with your own (managed) database and a real Secret.
#   kubectl apply -k deploy/kubernetes/example
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taskspipes
resources:
  - namespace.yaml
  - ../base
  - ../backup
  - postgres.yaml
  - redis.yaml
  - ingress.yaml
secretGenerator:
  - name: taskspipes
    # Your values, never in git: cp secret.env.example secret.env, then fill it in (openssl rand -hex 32 for the
    # secret and the password). Without secret.env, nothing is applied: no instance runs with a known secret.
    envs:
      - secret.env
generatorOptions:
  disableNameSuffixHash: true
