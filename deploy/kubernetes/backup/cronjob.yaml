apiVersion: batch/v1
kind: CronJob
metadata:
  name: taskspipes-backup
spec:
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 70          # "postgres" in the image
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pg-dump
              # The same major version as the database, or newer.
              image: postgres:17-alpine
              env:
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: taskspipes, key: DATABASE_URL } }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  f=/backups/taskspipes-$(date -u +%Y%m%d-%H%M%S).dump
                  pg_dump -Fc --no-owner "$DATABASE_URL" > "$f.part" && mv "$f.part" "$f"
                  find /backups -name 'taskspipes-*.dump' -mtime +14 -delete
                  ls -l /backups
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: backups, mountPath: /backups }
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: taskspipes-backups }
