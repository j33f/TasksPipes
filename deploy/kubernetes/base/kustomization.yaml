# TasksPipes on Kubernetes: the app only. PostgreSQL (and, optionally, Redis) are yours — a managed database is
# advised. Configuration comes from the Secret "taskspipes" (see docs/KUBERNETES.md). Use it from an overlay:
#   resources: [ github.com/j33f/TasksPipes//deploy/kubernetes/base?ref=v0.40.0 ]
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: taskspipes
    includeSelectors: true
resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml
images:
  - name: ghcr.io/j33f/taskspipes
    newTag: "0.40.0"
