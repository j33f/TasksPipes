apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskspipes
spec:
  # Several instances share the database: live updates and presence go through PostgreSQL, background work is
  # claimed in it, and starting instances take turns on the schema (docs/HOSTING.md, "Several instances").
  replicas: 2
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: {}
  template:
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000          # "node" in the image
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: taskspipes }
      containers:
        - name: app
          image: ghcr.io/j33f/taskspipes
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - secretRef: { name: taskspipes }
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3000" }
            # One-click updates are for Docker Compose: change the image's tag instead.
            - { name: UPDATER_TOKEN, value: "" }
          # The schema is brought up to date at start: give it time on a big database.
          startupProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 5
            failureThreshold: 60
          # The process answers: restarted otherwise (a database outage restarts nothing).
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          # It reaches the database: given requests otherwise.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            # Leave the load balancer before stopping: live connections reconnect to another instance.
            preStop:
              exec: { command: ["sleep", "5"] }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
