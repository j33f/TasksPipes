services:
  app:
    build: .
    image: taskspipes:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://taskspipes:${POSTGRES_PASSWORD}@db:5432/taskspipes
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskspipes
      POSTGRES_USER: taskspipes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskspipes -d taskspipes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
