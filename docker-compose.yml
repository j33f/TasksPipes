services:
  app:
    build: .
    image: taskspipes:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://taskspipes:${POSTGRES_PASSWORD}@db:5432/taskspipes
      REDIS_URL: redis://redis:6379
    ports:
      # Only this machine (its reverse proxy) reaches the app; see APP_BIND in docs/HOSTING.md.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Rate limit counters only: nothing to keep across restarts.
  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskspipes
      POSTGRES_USER: taskspipes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskspipes -d taskspipes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
