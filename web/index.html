<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TasksPipes</title>
    <script>
      // Theme and language chosen in the profile, applied before the page draws (no flash).
      try {
        const theme = localStorage.getItem("tp:theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        const lang = localStorage.getItem("tp:locale") || (navigator.language || "en").slice(0, 2);
        document.documentElement.lang = lang === "fr" ? "fr" : "en";
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
