# Coverage is reported per part (see .github/workflows/ci.yml); it informs, it does not block.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flags:
  server-unit:
    paths: [server/src/]
    carryforward: true
  server-functional:
    paths: [server/src/]
    carryforward: true
  web:
    paths: [web/src/]
    carryforward: true

comment:
  layout: "condensed_header, diff, flags"
